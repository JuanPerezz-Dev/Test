<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git</title>
</head>
<body>
    <h1>Calculadora Basica</h1>
    <img id="imagen" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRLrFMOmqxkOiaq8W_DQ8BXRdXRe4GuLeuUbqBY-59l434v5E7WLwZqkzW-&s=10" alt="icono de calculadora" width="100px">
    <div>
        <label for="num1">Numero 1:</label>
        <input type="number" placeholder="Ingresa un numero" id="num1">
    </div>
    <br>
    <div>
        <label for="num2">Numero 2:</label>
        <input type="number" placeholder="Ingresa un numero" id="num2">
    </div>
    <hr>
    <select name="operaciones" id="operaciones">
        <option value="">Selecciona una opcion</option>
        <option value="suma">Suma(+)</option>
        <option value="resta">Resta(-)</option>
        <option value="multi">Multiplicacion(*)</option>
        <option value="division">Division(/)</option>
    </select>
    <br>
    <button id="resultado">Resultado</button>
    <p id="salida"></p>
    <script src="js/app.js"></script>
</body>
</html>
